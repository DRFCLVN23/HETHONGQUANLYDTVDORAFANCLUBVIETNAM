<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Hệ Thống Quản Lý Dịch Thuật Viên</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0a0b10;
            --card-bg: rgba(18, 22, 36, 0.85);
            --border-color: rgba(0, 240, 255, 0.3);
            --primary-neon: #00f0ff;
            --secondary-neon: #ff007f;
            --accent-neon: #7000ff;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --danger-neon: #ff3366;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }
        body {
            background-color: var(--bg-dark); color: var(--text-main);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background-image: radial-gradient(circle at 10% 20%, rgba(112, 0, 255, 0.25) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(0, 240, 255, 0.25) 0%, transparent 40%);
            padding: 20px;
        }
        .login-card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 40px; width: 100%; max-width: 420px;
            backdrop-filter: blur(15px); box-shadow: 0 0 30px rgba(0, 240, 255, 0.15);
            position: relative; overflow: hidden;
        }
        .login-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, var(--secondary-neon), var(--primary-neon));
        }
        .brand-header { text-align: center; margin-bottom: 30px; }
        .brand-header img { height: 50px; width: auto; object-fit: contain; margin-bottom: 10px; }
        .brand-header p { font-size: 13px; color: var(--text-muted); margin-top: 5px; }
        .form-group { margin-bottom: 20px; position: relative; }
        .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper i { position: absolute; left: 14px; color: var(--primary-neon); font-size: 16px; }
        .form-control {
            width: 100%; padding: 12px 14px 12px 42px; background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color); border-radius: 6px; color: #fff; font-size: 14px;
            outline: none; transition: all 0.3s;
        }
        .form-control:focus { border-color: var(--primary-neon); box-shadow: 0 0 10px rgba(0, 240, 255, 0.3); }
        .btn-login {
            width: 100%; padding: 12px; background: linear-gradient(45deg, var(--accent-neon), var(--primary-neon));
            border: none; border-radius: 6px; color: #fff; font-family: 'Orbitron', sans-serif;
            font-size: 14px; font-weight: 600; letter-spacing: 1px; cursor: pointer;
            transition: all 0.3s; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-login:hover { opacity: 0.9; box-shadow: 0 0 20px rgba(0, 240, 255, 0.5); }
        .error-message {
            background: rgba(255, 51, 102, 0.15); border: 1px solid var(--danger-neon);
            color: #ff809b; padding: 10px; border-radius: 6px; font-size: 13px;
            margin-bottom: 20px; display: none; text-align: center;
        }
        .footer-note { text-align: center; margin-top: 25px; font-size: 12px; color: var(--text-muted); }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand-header">
            <img src="Doraemon fansub.png" alt="Logo">
            <p>Hệ Thống Quản Lý Dịch Thuật Viên</p>
        </div>
        <div class="error-message" id="errorMessage"></div>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Tài Khoản (Email)</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" class="form-control" placeholder="admin@system.com" required autocomplete="username">
                </div>
            </div>
            <div class="form-group">
                <label for="password">Mật Khẩu</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>
            <button type="submit" class="btn-login" id="loginBtn">
                <span>ĐĂNG NHẬP</span>
                <i class="fas fa-arrow-right"></i>
            </button>
        </form>
        <div class="footer-note">From the Dora Fanclub Vietnam administration team</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
                "firebase/analytics": "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "firebase/auth";
        import { getFirestore, doc, getDoc, collection, getDocs } from "firebase/firestore";

        const firebaseConfig = {
            apiKey: "AIzaSyAxMuHOdj8a8c3lDpZG_k8fFUV6tCVkH8w",
            authDomain: "hethongquanlyadichthuatvien.firebaseapp.com",
            databaseURL: "https://hethongquanlyadichthuatvien-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "hethongquanlyadichthuatvien",
            storageBucket: "hethongquanlyadichthuatvien.firebasestorage.app",
            messagingSenderId: "78223981328",
            appId: "1:78223981328:web:8667950575d90be2420395",
            measurementId: "G-X6CQJ1PTY9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorMessage = document.getElementById('errorMessage');
        const loginBtn = document.getElementById('loginBtn');

        async function checkMaintenanceAndRole(user) {
            try {
                let userRole = 'dtv';
                const transSnap = await getDocs(collection(db, "Transactors"));
                transSnap.forEach(docSnap => {
                    const d = docSnap.data();
                    if (d.email && d.email.toLowerCase() === user.email.toLowerCase()) {
                        if (d.role) userRole = d.role;
                    }
                });
                console.log("🔐 Role hiện tại của user:", userRole);

                const isDTV = (userRole && userRole.toLowerCase() === 'dtv') || (!userRole && !user.email.includes('bqt'));
                const maintRef = doc(db, "system_settings", "maintenance");
                const maintSnap = await getDoc(maintRef);
                const isMaintenance = maintSnap.exists() && maintSnap.data().isMaintenance === true;
                console.log("🛠️ Trạng thái bảo trì:", isMaintenance);

                if (isMaintenance && isDTV) {
                    await signOut(auth);
                    errorMessage.style.display = 'block';
                    errorMessage.innerText = '⛔ HỆ THỐNG ĐANG BẢO TRÌ! Vui lòng quay lại sau.';
                    return false;
                }
                return true;
            } catch (err) {
                console.error("❌ LỖI CHI TIẾT KHI KIỂM TRA:", err);
                // Nếu lỗi do quyền Firestore, vẫn cho phép truy cập để không bị chặn oan
                return true;
            }
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const canAccess = await checkMaintenanceAndRole(user);
                if (canAccess) {
                    window.location.href = "dashboard.html";
                }
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMessage.style.display = 'none';
            loginBtn.disabled = true;
            loginBtn.querySelector('span').innerText = 'ĐANG XỬ LÝ...';

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const canAccess = await checkMaintenanceAndRole(userCredential.user);
                
                if (canAccess) {
                    window.location.href = "dashboard.html";
                } else {
                    loginBtn.disabled = false;
                    loginBtn.querySelector('span').innerText = 'ĐĂNG NHẬP';
                }
            } catch (error) {
                loginBtn.disabled = false;
                loginBtn.querySelector('span').innerText = 'ĐĂNG NHẬP';
                errorMessage.style.display = 'block';

                switch (error.code) {
                    case 'auth/invalid-email': errorMessage.innerText = 'Email không hợp lệ!'; break;
                    case 'auth/user-not-found':
                    case 'auth/wrong-password':
                    case 'auth/invalid-credential': errorMessage.innerText = 'Sai Email hoặc Mật khẩu!'; break;
                    case 'auth/too-many-requests': errorMessage.innerText = 'Đăng nhập sai quá nhiều lần. Vui lòng thử lại sau!'; break;
                    default: errorMessage.innerText = 'Đăng nhập thất bại: ' + error.message;
                }
            }
        });
    </script>
</body>
</html>
