<!DOCTYPE html>
<html lang="vi">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Đăng nhập - Doraemon Fansub VN</title>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics-compat.js">
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255, 235, 59, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(255, 255, 255, 0.05) 0%, transparent 50%);
            z-index: -2;
            animation: pulse 8s ease-in-out infinite alternate;
        }

        @media (min-width: 1024px) {
            body {
                background-image: url('anh_nen_pc.png');
                background-position: center center;
                background-repeat: no-repeat;
                background-size: cover;
                background-attachment: fixed;
            }

            .bg-character {
                position: fixed;
                top: 50%;
                transform: translateY(-50%);
                width: 320px;
                height: 420px;
                background-position: center center;
                background-size: contain;
                background-repeat: no-repeat;
                z-index: 3;
                pointer-events: none;
            }

            .bg-left {
                left: 2%;
                background-image: url('news_dora.png');
            }

            .bg-right {
                right: 2%;
                background-image: url('news_nobi.png');
            }

            .login-container {
                max-width: 520px;
                background: rgba(255, 255, 255, 0.92);
                box-shadow: 0 35px 80px rgba(0, 0, 0, 0.18);
                border: 1px solid rgba(255, 255, 255, 0.65);
                position: relative;
                z-index: 1;
            }
        }

        @media (max-width: 1023px) {
            body {
                padding-top: 80px;
                padding-bottom: 80px;
                background-image: url('anh_nen_pc.png');
                background-position: center top;
                background-repeat: no-repeat;
                background-size: cover;
            }

            .login-container {
                margin-top: 40px;
                margin-bottom: 40px;
            }

            .bg-left,
            .bg-right {
                position: fixed;
                left: 50%;
                transform: translateX(-50%);
                width: 260px;
                height: 260px;
                background-position: center center;
                background-size: contain;
                background-repeat: no-repeat;
                z-index: 3;
                pointer-events: none;
                animation: floatCharacter 6s ease-in-out infinite;
            }

            .bg-left {
                top: -120px;
                background-image: url('news_dora.png');
            }

            .bg-right {
                bottom: -120px;
                background-image: url('news_nobi.png');
            }
        }

        @keyframes floatCharacter {
            0%, 100% {
                transform: translateX(-50%) translateY(0);
            }
            50% {
                transform: translateX(-50%) translateY(18px);
            }
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .login-container {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px 35px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.5s ease;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .loading-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.95);
            z-index: 10;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 16px;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-overlay .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f0f2f5;
            border-top: 4px solid #1a73e8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-overlay p {
            color: #1a1a2e;
            font-weight: 600;
            font-size: 15px;
        }

        .logo-wrapper {
            text-decoration: none;

        }

        .logo {

        }

        .logo img {

        .logo h1 {

        @media (max-width: 480px) {

    <script>
        document.getElementById('domainInfo').textContent = window.location.hostname;

        // ============================================================
        // FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBt3G9n5JYu3EsvqJR9IoW2vRAc_Es3-ws",
            authDomain: "doraemon-fansub-vietnam.firebaseapp.com",
            projectId: "doraemon-fansub-vietnam",
            storageBucket: "doraemon-fansub-vietnam.firebasestorage.app",
            messagingSenderId: "380840935390",
            appId: "1:380840935390:web:60fab4722a9fba5053a74f",
            measurementId: "G-0S2Z4XRK0B"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const provider = new firebase.auth.GoogleAuthProvider();

        const loading = document.getElementById('loadingOverlay');
        const errorMsg = document.getElementById('errorMessage');
        const successMsg = document.getElementById('successMessage');

        // ============================================================
        // HÀM HIỂN THỊ
        // ============================================================
        function showLoading() { loading.classList.add('active'); }

        function hideLoading() { loading.classList.remove('active'); }

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
            successMsg.style.display = 'none';
            setTimeout(() => errorMsg.style.display = 'none', 8000);
        }

        function showSuccess(msg) {
            successMsg.textContent = msg;
            successMsg.style.display = 'block';
            errorMsg.style.display = 'none';
            setTimeout(() => successMsg.style.display = 'none', 5000);
        }

        function clearMessages() {
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
        }

        async function hmacSha1(keyBytes, messageBytes) {
            const cryptoKey = await crypto.subtle.importKey(
                'raw',
                keyBytes,
                { name: 'HMAC', hash: 'SHA-1' },
                false,
                ['sign']
            );
            const signature = await crypto.subtle.sign('HMAC', cryptoKey, messageBytes);
            return new Uint8Array(signature);
        }

        function base32ToBytes(base32) {
            const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
            let bits = '';
            let bytes = [];
            base32 = base32.replace(/=+$/, '').toUpperCase();
            for (let char of base32) {
                const val = alphabet.indexOf(char);
                if (val === -1) continue;
                bits += val.toString(2).padStart(5, '0');
            }
            for (let i = 0; i + 8 <= bits.length; i += 8) {
                bytes.push(parseInt(bits.slice(i, i + 8), 2));
            }
            return new Uint8Array(bytes);
        }

        function leftPad(str, length) {
            return str.toString().padStart(length, '0');
        }

        async function verifyTOTP(secret, code) {
            if (!secret || !code) return false;
            code = code.trim();
            const now = Math.floor(Date.now() / 1000 / 30);
            for (let delta = -1; delta <= 1; delta++) {
                const counter = now + delta;
                const counterBytes = new ArrayBuffer(8);
                const view = new DataView(counterBytes);
                view.setUint32(4, counter, false);
                const hash = await hmacSha1(base32ToBytes(secret), new Uint8Array(counterBytes));
                const offset = hash[hash.length - 1] & 0xf;
                const binary = ((hash[offset] & 0x7f) << 24) |
                    ((hash[offset + 1] & 0xff) << 16) |
                    ((hash[offset + 2] & 0xff) << 8) |
                    (hash[offset + 3] & 0xff);
                if (leftPad(binary % 10 ** 6, 6) === code) return true;
            }
            return false;
        }

        const TWO_FACTOR_SESSION_KEY = 'twoFactorVerifiedUid';

        function setTwoFactorVerifiedUid(uid) {
            if (!uid) return;
            localStorage.setItem(TWO_FACTOR_SESSION_KEY, uid);
        }

        function getTwoFactorVerifiedUid() {
            return localStorage.getItem(TWO_FACTOR_SESSION_KEY);
        }

        function clearTwoFactorVerifiedUid() {
            localStorage.removeItem(TWO_FACTOR_SESSION_KEY);
        }

        function isTwoFactorVerifiedForUser(uid) {
            return uid && getTwoFactorVerifiedUid() === uid;
        }

        async function getUserTwoFactorData(uid) {
            if (!uid) return null;
            try {
                const doc = await db.collection('users').doc(uid).get();
                return doc.exists ? doc.data()?.twoFactor || null : null;
            } catch (e) {
                console.error('Lỗi kiểm tra 2FA:', e);
                return null;
            }
        }

        async function ensureLoginPageTwoFactorState(user) {
            if (!user) return false;
            const twoFactor = await getUserTwoFactorData(user.uid);
            if (twoFactor?.enabled && twoFactor.secret) {
                if (!isTwoFactorVerifiedForUser(user.uid)) {
                    showTwoFactorStep(twoFactor.secret, user.uid);
                    return true;
                }
            } else if (isTwoFactorVerifiedForUser(user.uid)) {
                clearTwoFactorVerifiedUid();
            }
            return false;
        }

        let pending2faSecret = null;
        let pending2faUid = null;
        let twoFactorLoginInProgress = false;

        function showTwoFactorStep(secret, userUid) {
            pending2faSecret = secret;
            pending2faUid = userUid;
            twoFactorLoginInProgress = true;
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('twoFactorSection').style.display = 'block';
            document.getElementById('twoFactorCode').value = '';
            showSuccess('✅ Đăng nhập thành công. Vui lòng nhập mã 2FA.');
        }

        function resetTwoFactorStep() {
            pending2faSecret = null;
            pending2faUid = null;
            twoFactorLoginInProgress = false;
            document.getElementById('twoFactorSection').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('twoFactorCode').value = '';
        }

        // ============================================================
        // KIỂM TRA BANNED
        // ============================================================
        async function checkBannedUser(email) {
            if (!email) return false;
            try {
                const doc = await db.collection('banned_users').doc(email).get();
                if (doc.exists) {
                    console.warn('⚠️ Tài khoản đã bị cấm:', email);
                    return true;
                }
                return false;
            } catch (e) {
                console.error('Lỗi kiểm tra banned:', e);
                return false;
            }
        }

        // ============================================================
        // LƯU USER VÀO FIRESTORE
        // ============================================================
        function saveUserToFirestore(user, isNew = false) {
            const userData = {
                email: user.email,
                displayName: user.displayName || user.email.split('@')[0],
                photoURL: user.photoURL || '',
                providerData: user.providerData || [],
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            if (isNew) {
                userData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
            }

            return db.collection('users').doc(user.uid).set(userData, { merge: true })
                .then(() => {
                    console.log('✅ Đã lưu user vào Firestore:', user.email);
                    return true;
                })
                .catch((error) => {
                    console.error('❌ Lỗi lưu user:', error);
                    return false;
                });
        }

        // ============================================================
        // LOGIN
        // ============================================================
        document.getElementById('loginBtn').addEventListener('click', function() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!email || !password) {
                showError('📝 Vui lòng nhập đầy đủ email và mật khẩu!');
                return;
            }

            twoFactorLoginInProgress = true;
            showLoading();
            this.disabled = true;

            auth.signInWithEmailAndPassword(email, password)
                .then(async (userCredential) => {
                    const user = userCredential.user;

                    // Kiểm tra banned
                    const isBanned = await checkBannedUser(user.email);
                    if (isBanned) {
                        showError('🚫 Tài khoản của bạn đã bị cấm! Vui lòng liên hệ Admin.');
                        await auth.signOut();
                        return;
                    }

                    await saveUserToFirestore(user, false);
                    const userDoc = await db.collection('users').doc(user.uid).get();
                    const userData = userDoc.exists ? userDoc.data() : {};

                    if (userData?.twoFactor?.enabled && userData.twoFactor.secret) {
                        showTwoFactorStep(userData.twoFactor.secret, user.uid);
                        return;
                    }

                    showSuccess('✅ Đăng nhập thành công! Đang chuyển hướng...');
                    setTimeout(() => window.location.href = 'index.html', 1500);
                })
                .catch((err) => {
                    let msg = '❌ Đăng nhập thất bại, hãy kiểm tra lại tài khoản hoặc mật khẩu đi. ';
                    switch (err.code) {
                        case 'auth/user-not-found':
                            msg += 'Email chưa được đăng ký.';
                            break;
                        case 'auth/wrong-password':
                            msg += 'Mật khẩu không đúng.';
                            break;
                        case 'auth/invalid-email':
                            msg += 'Email không hợp lệ.';
                            break;
                        case 'auth/too-many-requests':
                            msg += 'Quá nhiều yêu cầu, thử lại sau.';
                            break;
                        default:
                            msg += err.message;
                    }
                    showError(msg);
                })
                .finally(() => {
                    this.disabled = false;
                    hideLoading();
                });
        });

        // ============================================================
        // GOOGLE LOGIN
        // ============================================================
        document.getElementById('googleBtn').addEventListener('click', function() {
            showLoading();
            this.disabled = true;

            auth.signInWithPopup(provider)
                .then(async (result) => {
                    const user = result.user;
                    twoFactorLoginInProgress = true;

                    // Kiểm tra banned
                    const isBanned = await checkBannedUser(user.email);
                    if (isBanned) {
                        showError('🚫 Tài khoản của bạn đã bị cấm! Liên hệ Admin.');
                        await auth.signOut();
                        return;
                    }

                    await saveUserToFirestore(user, true);
                    const userDoc = await db.collection('users').doc(user.uid).get();
                    const userData = userDoc.exists ? userDoc.data() : {};

                    if (userData?.twoFactor?.enabled && userData.twoFactor.secret) {
                        showTwoFactorStep(userData.twoFactor.secret, user.uid);
                        return;
                    }

                    showSuccess('✅ Đăng nhập thành công! Đang chuyển hướng...');
                    setTimeout(() => window.location.href = 'index.html', 1500);
                })
                .catch((err) => {
                    let msg = '❌ Đăng nhập Google thất bại! ';
                    switch (err.code) {
                        case 'auth/popup-closed-by-user':
                            msg += 'Bạn đã đóng cửa sổ đăng nhập.';
                            break;
                        case 'auth/popup-blocked':
                            msg += 'Trình duyệt chặn popup, vui lòng cho phép.';
                            break;
                        default:
                            msg += err.message;
                    }
                    showError(msg);
                })
                .finally(() => {
                    this.disabled = false;
                    hideLoading();
                });
        });

        // ============================================================
        // REGISTER
        // ============================================================
        document.getElementById('registerBtn').addEventListener('click', function() {
            const name = document.getElementById('registerName').value.trim();
            const email = document.getElementById('registerEmail').value.trim();
            const password = document.getElementById('registerPassword').value.trim();
            const confirm = document.getElementById('registerConfirmPassword').value.trim();

            if (!name || !email || !password || !confirm) {
                showError('📝 Vui lòng nhập đầy đủ thông tin!');
                return;
            }
            if (password.length < 6) {
                showError('🔒 Mật khẩu phải có ít nhất 6 ký tự!');
                return;
            }
            if (password !== confirm) {
                showError('❌ Mật khẩu xác nhận không khớp!');
                return;
            }

            showLoading();
            this.disabled = true;

            auth.createUserWithEmailAndPassword(email, password)
                .then(async (userCredential) => {
                    const user = userCredential.user;

                    // Cập nhật tên hiển thị
                    await user.updateProfile({ displayName: name });

                    await saveUserToFirestore(user, true);
                    showSuccess('✅ Đăng ký thành công! Đang chuyển hướng...');
                    setTimeout(() => window.location.href = 'index.html', 1500);
                })
                .catch((err) => {
                    let msg = '❌ Đăng ký thất bại! ';
                    switch (err.code) {
                        case 'auth/email-already-in-use':
                            msg += 'Email đã được sử dụng.';
                            break;
                        case 'auth/invalid-email':
                            msg += 'Email không hợp lệ.';
                            break;
                        case 'auth/weak-password':
                            msg += 'Mật khẩu quá yếu.';
                            break;
                        default:
                            msg += err.message;
                    }
                    showError(msg);
                })
                .finally(() => {
                    this.disabled = false;
                    hideLoading();
                });
        });

        // ============================================================
        // FORGOT PASSWORD
        // ============================================================
        document.getElementById('forgotBtn').addEventListener('click', function() {
            const email = document.getElementById('forgotEmail').value.trim();
            if (!email) {
                showError('📝 Vui lòng nhập email của bạn!');
                return;
            }

            showLoading();
            this.disabled = true;

            auth.sendPasswordResetEmail(email, {
                    url: window.location.href,
                    handleCodeInApp: false
                })
                .then(() => {
                    showSuccess(`✅ Email đặt lại mật khẩu đã gửi đến ${email}!`);
                    document.getElementById('forgotEmail').value = '';
                    setTimeout(() => {
                        document.getElementById('forgotForm').style.display = 'none';
                        document.getElementById('loginForm').style.display = 'block';
                        clearMessages();
                    }, 4000);
                })
                .catch((err) => {
                    let msg = '❌ Gửi email thất bại! ';
                    switch (err.code) {
                        case 'auth/user-not-found':
                            msg += 'Email này chưa được đăng ký.';
                            break;
                        case 'auth/invalid-email':
                            msg += 'Email không hợp lệ.';
                            break;
                        case 'auth/too-many-requests':
                            msg += 'Quá nhiều yêu cầu, thử lại sau.';
                            break;
                        default:
                            msg += err.message;
                    }
                    showError(msg);
                })
                .finally(() => {
                    this.disabled = false;
                    hideLoading();
                });
        });

        // ============================================================
        // TOGGLE FORMS
        // ============================================================
        document.getElementById('showRegister').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
            document.getElementById('forgotForm').style.display = 'none';
            clearMessages();
        });

        document.getElementById('showForgot').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('forgotForm').style.display = 'block';
            clearMessages();
        });

        document.getElementById('backToLogin').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('forgotForm').style.display = 'none';
            clearMessages();
        });

        document.getElementById('backToLogin2').addEventListener('click', function(e) {
            e.preventDefault();
            resetTwoFactorStep();
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('forgotForm').style.display = 'none';
            clearMessages();
        });

        document.getElementById('verifyTwoFactorBtn').addEventListener('click', async function() {
            const code = document.getElementById('twoFactorCode').value.trim();
            if (!pending2faUid || !pending2faSecret) {
                showError('❌ Vui lòng nhập email và mật khẩu trước.');
                resetTwoFactorStep();
                return;
            }
            if (!code) {
                showError('📝 Vui lòng nhập mã 2FA.');
                return;
            }

            this.disabled = true;
            this.textContent = '⏳ Đang xác thực...';

            const valid = await verifyTOTP(pending2faSecret, code);
            if (valid) {
                setTwoFactorVerifiedUid(pending2faUid);
                showSuccess('✅ Xác thực 2FA thành công! Đang chuyển hướng...');
                setTimeout(() => window.location.href = 'index.html', 1500);
            } else {
                showError('❌ Mã 2FA không đúng. Vui lòng thử lại.');
            }

            this.disabled = false;
            this.textContent = '✅ Xác thực 2 lớp';
        });

        document.getElementById('cancelTwoFactorBtn').addEventListener('click', async function() {
            clearTwoFactorVerifiedUid();
            await auth.signOut();
            resetTwoFactorStep();
            showError('✋ Đã hủy 2FA. Vui lòng đăng nhập lại.');
        });

        // ============================================================
        // ENTER KEY
        // ============================================================
        document.getElementById('email').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('password').focus();
            }
        });

        document.getElementById('password').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('loginBtn').click();
            }
        });

        document.getElementById('registerEmail').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('registerPassword').focus();
            }
        });

        document.getElementById('registerPassword').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('registerConfirmPassword').focus();
            }
        });

        document.getElementById('twoFactorCode')?.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('verifyTwoFactorBtn').click();
            }
        });

        document.getElementById('registerConfirmPassword').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('registerBtn').click();
            }
        });

        document.getElementById('forgotEmail').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('forgotBtn').click();
            }
        });

        // ============================================================
        // AUTH STATE - TỰ ĐỘNG CHUYỂN HƯỚNG
        // ============================================================
        auth.onAuthStateChanged(async function(user) {
            if (!user) return;

            const requiresTwoFactor = await ensureLoginPageTwoFactorState(user);
            if (requiresTwoFactor) return;

            if (window.location.pathname.includes('login.html')) {
                window.location.href = 'index.html';
            }
        });

        console.log('🔥 Firebase Auth sẵn sàng!');
        console.log('🌐 Domain:', window.location.hostname);
        console.log('🎬 Đây là trang đăng nhập của cộng đồng Doraemon Fansub');
        console.log('✅ User sẽ được lưu vào Firestore khi đăng nhập/đăng ký');
    </script>
</body>
</html>
